parameters:
    app.upload_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $contactTo: '%env(CONTACT_TO)%'
            string $contactFrom: '%env(CONTACT_FROM)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    App\Service\FileUploader:
        arguments:
            $uploadDir: '%app.upload_dir%'
